[build-system]
requires = ["scikit-build-core>=0.11,<0.12"]
build-backend = "scikit_build_core.build"

[project]
name = "ultralight-py"
version = "0.2.0"
description = "Python bindings for Ultralight"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.scikit-build]
wheel.packages = ["src/ultralight_py"]
sdist.include = ["externals/pybind11/**", "externals/ulbind17/**"]
sdist.exclude = ["issue.md"]
