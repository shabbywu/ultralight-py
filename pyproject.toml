[build-system]
requires = ["scikit-build-core>=0.11,<0.12"]
build-backend = "scikit_build_core.build"

[project]
name = "ultralight-py"
version = "0.6.1"
description = "Python bindings for Ultralight"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typing-extensions==4.16.0"]

[project.optional-dependencies]
pillow = ["Pillow>=11,<13"]
numpy = ["numpy>=1.26,<3"]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]
dev = ["ruff==0.17.0"]

[tool.scikit-build]
wheel.packages = ["src/ultralight_py"]
# Explicit includes take precedence over excludes in scikit-build-core.
# Negate cache/Git paths here too so submodule .git files cannot leak into sdist.
sdist.include = [
  "externals/pybind11/**", "externals/ulbind17/**", "scripts/**", "tests/**", "examples/**",
  "!**/.git", "!**/.git/**", "!**/__pycache__/**", "!**/*.pyc",
  "!**/build/**", "!**/sdk-cache/**", "!**/CMakeCache.txt", "!**/CMakeFiles/**",
  "!**/.venv/**", "!**/.ruff_cache/**", "!**/.pytest_cache/**",
]
sdist.exclude = [
  "**/.git", "**/.git/**", "**/__pycache__/**", "**/*.pyc",
  "**/build/**", "**/sdk-cache/**", "**/CMakeCache.txt", "**/CMakeFiles/**",
  "**/.venv/**", "**/.ruff_cache/**", "**/.pytest_cache/**",
]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "pp* cp3??t-* *musllinux*"
test-requires = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "Pillow>=11,<13", "numpy>=1.26,<3"]
test-sources = ["tests", "examples", "scripts/test_wheel.py"]
test-command = "python -I scripts/test_wheel.py"
config-settings = { "cmake.define.ULTRALIGHT_SDK_VERSION" = "2.0.0-beta.2" }

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_34"
before-all = "dnf --disablerepo='epel*' install -y xorg-x11-server-Xvfb xorg-x11-xauth libX11 libXext libXrender libXt fontconfig freetype glib2 nss mesa-libGL alsa-lib"
repair-wheel-command = "auditwheel repair --only-plat --plat manylinux_2_34_x86_64 -w {dest_dir} {wheel}"
test-command = "xvfb-run -a python -I scripts/test_wheel.py"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# Search the SDK DLLs already installed beside _native, and still analyze their
# transitive dependencies so external runtime DLLs are repaired and bundled.
# Extended Windows API sets are resolved by the OS loader, not vendored DLLs.
repair-wheel-command = 'delvewheel repair --ignore-existing --analyze-existing --exclude "ext-ms-win-*.dll" -w {dest_dir} -v {wheel}'

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.3" }
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} --require-target-macos-version 11.3 -w {dest_dir} -v {wheel}"

[tool.ruff]
required-version = "==0.17.0"
target-version = "py310"
line-length = 100
extend-exclude = ["externals", "build", "dist"]
force-exclude = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
